name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      SCHEME: Aerio
      PROJECT: Aerio.xcodeproj
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Generate BuildInfo
        env:
          BUILDINFO_BRANCH: ${{ github.ref_name }}
          BUILDINFO_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/gen-buildinfo.sh

      - name: Run tests
        # Fails when zero tests ran — xcodebuild alone reports success in that case.
        run: ./scripts/test.sh

      - name: Set build number
        run: |
          VERSION=${{ steps.version.outputs.version }}
          agvtool new-version -all "${VERSION//\.}"

      - name: Build Release
        # Built ad-hoc on purpose; sign-and-notarize.sh re-signs with Developer ID.
        #
        # MARKETING_VERSION goes in as a build setting: Info.plist is generated
        # (GENERATE_INFOPLIST_FILE), so `agvtool new-marketing-version` had no
        # CFBundleShortVersionString key to edit and every release through 1.7.0
        # shipped as "1.0.1" in Finder and the About panel.
        run: |
          xcodebuild -project $PROJECT \
            -scheme $SCHEME \
            -configuration Release \
            -derivedDataPath $RUNNER_TEMP/build \
            OAUTH_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this codesign blocks on a GUI prompt that no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Put the new keychain first in the search list, keeping the defaults.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign, notarize and package
        # Apple's notary queue is usually minutes but occasionally much longer;
        # this is a backstop against a job that would otherwise hang for hours.
        timeout-minutes: 150
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          EXPECT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"

          NOTARY_KEY="$RUNNER_TEMP/notary.p8" \
            ./scripts/sign-and-notarize.sh \
              "$RUNNER_TEMP/build/Build/Products/Release/Aerio.app" \
              "${{ steps.version.outputs.version }}" \
              "$RUNNER_TEMP"

      # Must run after stapling — the staple rewrites the DMG and changes its hash.
      - name: Compute SHA256
        id: sha
        run: |
          DMG_PATH="$RUNNER_TEMP/Aerio-${{ steps.version.outputs.version }}.dmg"
          SHA=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG_PATH="$RUNNER_TEMP/Aerio-${{ steps.version.outputs.version }}.dmg"
          # Use existing release if already created (e.g. via gh release create locally),
          # otherwise create a new one
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DMG_PATH" \
              --title "Aerio ${{ steps.version.outputs.version }}" \
              --generate-notes
          fi

      - name: Update Homebrew tap
        # Tap update is post-release housekeeping — DMG is already on the GitHub release.
        # Don't fail the whole workflow if this step has issues (e.g., TAP_TOKEN expired).
        # If it fails, run scripts/update-tap.sh locally and re-run.
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=${{ steps.version.outputs.version }}
          SHA=${{ steps.sha.outputs.sha256 }}

          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN secret is empty. Set a PAT with 'repo' scope at"
            echo "::error::  https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "::error::Then re-run the script locally: scripts/update-tap.sh ${VERSION} ${SHA}"
            exit 1
          fi

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/VerusK/homebrew-aerio.git" "$RUNNER_TEMP/tap" || {
            echo "::error::Failed to clone homebrew-aerio. TAP_TOKEN may be invalid/expired."
            echo "::error::Refresh the PAT and update the TAP_TOKEN secret, then run scripts/update-tap.sh ${VERSION} ${SHA} locally."
            exit 1
          }
          cd "$RUNNER_TEMP/tap"

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/aerio.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA}\"/" Casks/aerio.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/aerio.rb
          git commit -m "Update Aerio to ${VERSION}"
          git push 2>&1 | tee /tmp/push.log || {
            echo "::error::git push to homebrew-aerio failed."
            if grep -q "Invalid username or token" /tmp/push.log; then
              echo "::error::TAP_TOKEN is expired or revoked. Refresh PAT at:"
              echo "::error::  https://github.com/settings/personal-access-tokens"
              echo "::error::Update secret at:"
              echo "::error::  https://github.com/${{ github.repository }}/settings/secrets/actions"
              echo "::error::Meanwhile, run locally: scripts/update-tap.sh ${VERSION} ${SHA}"
            fi
            exit 1
          }
