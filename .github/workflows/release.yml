name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      SCHEME: Aerio
      PROJECT: Aerio.xcodeproj
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Generate BuildInfo
        env:
          BUILDINFO_BRANCH: ${{ github.ref_name }}
          BUILDINFO_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/gen-buildinfo.sh

      - name: Run tests
        run: |
          xcodebuild test \
            -project $PROJECT \
            -scheme $SCHEME \
            -destination 'platform=macOS' \
            -skip-testing:AerioTests/GmailAPIClientTests/testConcurrent401sCoalesceIntoSingleRefresh \
            OAUTH_CLIENT_ID=test-ci-placeholder \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            || exit 1

      - name: Set version
        run: |
          VERSION=${{ steps.version.outputs.version }}
          agvtool new-marketing-version "$VERSION"
          agvtool new-version -all "${VERSION//\.}"

      - name: Build Release
        run: |
          xcodebuild -project $PROJECT \
            -scheme $SCHEME \
            -configuration Release \
            -derivedDataPath $RUNNER_TEMP/build \
            OAUTH_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create DMG
        run: |
          ./scripts/create-dmg.sh \
            "$RUNNER_TEMP/build/Build/Products/Release/Aerio.app" \
            "${{ steps.version.outputs.version }}" \
            "$RUNNER_TEMP"

      - name: Compute SHA256
        id: sha
        run: |
          DMG_PATH="$RUNNER_TEMP/Aerio-${{ steps.version.outputs.version }}.dmg"
          SHA=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG_PATH="$RUNNER_TEMP/Aerio-${{ steps.version.outputs.version }}.dmg"
          # Use existing release if already created (e.g. via gh release create locally),
          # otherwise create a new one
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DMG_PATH" \
              --title "Aerio ${{ steps.version.outputs.version }}" \
              --generate-notes
          fi

      - name: Update Homebrew tap
        # Tap update is post-release housekeeping — DMG is already on the GitHub release.
        # Don't fail the whole workflow if this step has issues (e.g., TAP_TOKEN expired).
        # If it fails, run scripts/update-tap.sh locally and re-run.
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=${{ steps.version.outputs.version }}
          SHA=${{ steps.sha.outputs.sha256 }}

          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN secret is empty. Set a PAT with 'repo' scope at"
            echo "::error::  https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "::error::Then re-run the script locally: scripts/update-tap.sh ${VERSION} ${SHA}"
            exit 1
          fi

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/VerusK/homebrew-aerio.git" "$RUNNER_TEMP/tap" || {
            echo "::error::Failed to clone homebrew-aerio. TAP_TOKEN may be invalid/expired."
            echo "::error::Refresh the PAT and update the TAP_TOKEN secret, then run scripts/update-tap.sh ${VERSION} ${SHA} locally."
            exit 1
          }
          cd "$RUNNER_TEMP/tap"

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/aerio.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA}\"/" Casks/aerio.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/aerio.rb
          git commit -m "Update Aerio to ${VERSION}"
          git push 2>&1 | tee /tmp/push.log || {
            echo "::error::git push to homebrew-aerio failed."
            if grep -q "Invalid username or token" /tmp/push.log; then
              echo "::error::TAP_TOKEN is expired or revoked. Refresh PAT at:"
              echo "::error::  https://github.com/settings/personal-access-tokens"
              echo "::error::Update secret at:"
              echo "::error::  https://github.com/${{ github.repository }}/settings/secrets/actions"
              echo "::error::Meanwhile, run locally: scripts/update-tap.sh ${VERSION} ${SHA}"
            fi
            exit 1
          }
