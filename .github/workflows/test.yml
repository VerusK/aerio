name: Tests

on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Generate BuildInfo
        env:
          BUILDINFO_BRANCH: ${{ github.ref_name }}
        run: ./scripts/gen-buildinfo.sh

      - name: Build and Test
        # Fails when zero tests ran — xcodebuild alone reports success in that case.
        run: ./scripts/test.sh
