name: Tests

on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Generate BuildInfo
        env:
          BUILDINFO_BRANCH: ${{ github.ref_name }}
        run: ./scripts/gen-buildinfo.sh

      - name: Build and Test
        run: |
          xcodebuild test \
            -project Aerio.xcodeproj \
            -scheme Aerio \
            -destination 'platform=macOS' \
            -skip-testing:AerioTests/GmailAPIClientTests/testConcurrent401sCoalesceIntoSingleRefresh \
            OAUTH_CLIENT_ID=test-ci-placeholder \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            || exit 1
